<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - 舰长地址收集系统</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .container {
            max-width: 420px;
        }

        .content {
            padding: 32px;
        }

        .instruction {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 25px;
            font-size: 15px;
            line-height: 1.6;
        }

        .divider {
            margin: 22px 0;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
    </style>
</head>
<body>

<div class="container animate-slideUp">
    <div class="card-header">
        <i class="fas fa-lock" style="font-size: 42px; margin-bottom: 12px; opacity: 0.9; display: block;"></i>
        <h1>账户登录</h1>
        <div class="nickname">{{ nickname }}</div>
    </div>

    <div class="content stagger">
        <p class="instruction">
            UID: <strong>{{ uid }}</strong><br>
            选择登录方式
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        <i class="fas fa-exclamation-circle"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login?uid={{ uid }}" method="post" id="passwordForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <div class="input-icon">
                    <i class="fas fa-key"></i>
                    <input type="password" name="password" placeholder="请输入登录密码" required autocomplete="off">
                </div>
            </div>

            <button type="submit" class="btn btn-gradient btn-block">
                <i class="fas fa-sign-in-alt"></i> 密码登录
            </button>
        </form>

        <div class="divider">或</div>

        <a href="/auth-login?uid={{ uid }}" class="btn btn-primary btn-block">
            <i class="fas fa-qrcode"></i> 弹幕鉴权登录
        </a>

        <div class="page-footer mt-25">
            <a href="/reset-password?uid={{ uid }}"><i class="fas fa-key"></i> 忘记密码 / 修改密码</a>
        </div>
    </div>
</div>

<div class="page-footer">
    <a href="https://github.com/HosisoraLing/bilibili-sailing-helper" target="_blank">
        <i class="fab fa-github"></i> bilibili-sailing-helper
    </a>
    <span> | AGPLv3 Licensed</span>
</div>

</body>
</html>
