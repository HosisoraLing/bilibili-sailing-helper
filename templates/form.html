<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舰长地址填写</title>
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "MiSans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 550px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px 30px;
            text-align: center;
        }

        .header h2 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .header .nickname {
            font-size: 16px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .logout-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 16px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-size: 13px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .form-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e5e5e5;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #667eea;
            background: white;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group input:invalid:not(:placeholder-shown) {
            border-color: #ff4757;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .form-row select {
            padding: 12px 8px;
            font-size: 14px;
        }

        .detail-input {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .tips {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 6px;
            margin-top: 25px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        .tips strong {
            color: #667eea;
            display: block;
            margin-bottom: 5px;
        }

        .required::after {
            content: " *";
            color: #ff4757;
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 20px;
            }

            .container {
                border-radius: 12px;
            }

            .header {
                padding: 20px;
            }

            .header h2 {
                font-size: 18px;
            }

            .form-body {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .form-group input,
            .form-group select {
                padding: 14px 15px;
                font-size: 16px; /* 防止iOS缩放 */
            }
        }

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-weight: 500;
        }

        .error-message {
            background: #fff0f0;
            border: 1px solid #ff4757;
            color: #ff4757;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }

        .success-message {
            background: #f0fff4;
            border: 1px solid #2ecc71;
            color: #2ecc71;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>📦 舰长地址填写</h2>
            <div class="nickname">舰长 {{ nickname }}</div>
            <div style="margin-top: 10px;">
                <a href="/logout" class="logout-btn">退出登录</a>
                <a href="/reset-password?uid={{ uid }}" class="logout-btn" style="margin-left: 8px; background: rgba(255,255,255,0.3);">修改密码</a>
                {% if current_user.is_admin() %}
                    <a href="/admin/panel" class="logout-btn" style="margin-left: 8px; background: rgba(255,255,255,0.4);">管理员面板</a>
                {% endif %}
            </div>
        </div>

        <div class="form-body">
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>

            <form method="post" action="/submit" id="addressForm">
                <input type="hidden" name="uid" value="{{ uid }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="form-group">
                    <label class="required" for="name">收件人姓名</label>
                    <input type="text" id="name" name="name" required placeholder="无需填写真实姓名" value="{{ address.receiver if address else '' }}">
                </div>

                <div class="form-group">
                    <label class="required" for="phone">手机号码</label>
                    <input type="tel" id="phone" name="phone" required pattern="^1[3-9]\d{9}$" placeholder="11位手机号码" value="{{ address.phone if address else '' }}">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="required" for="province">省</label>
                        <select id="province" name="province" required>
                            <option value="">请选择</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="required" for="city">市</label>
                        <select id="city" name="city" required disabled>
                            <option value="">请选择</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="required" for="district">区/县</label>
                        <select id="district" name="district" required disabled>
                            <option value="">请选择</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="required" for="detail">详细地址</label>
                    <input type="text" id="detail" name="detail" class="detail-input" required placeholder="街道、门牌号等" value="{{ address.address if address else '' }}">
                </div>

                <button type="submit" class="submit-btn">提交地址信息</button>
            </form>

            <div class="tips">
                <strong>💡 温馨提示</strong>
                • 请确保填写的信息准确无误<br>
                • 提交后可联系小蝰确认<br>
                • 地址仅用于邮寄舰长福利
            </div>
        </div>
    </div>

    <script>
        let regions = {};
        const provinceSelect = document.getElementById('province');
        const citySelect = document.getElementById('city');
        const districtSelect = document.getElementById('district');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const form = document.getElementById('addressForm');

        // 显示消息
        function showMessage(message, type = 'error') {
            if (type === 'error') {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
            } else {
                successMessage.textContent = message;
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
            }
        }

        // 预填数据（从模板传入）
        const prefillProvince = '{{ address.province if address else '' }}';
        const prefillCity = '{{ address.city if address else '' }}';
        const prefillDistrict = '{{ address.area if address else '' }}';

        // 加载行政区划数据
        fetch('/static/china_regions.json')
            .then(r => {
                if (!r.ok) throw new Error('网络错误');
                return r.json();
            })
            .then(data => {
                regions = data;
                // 填充省份
                for (const province in regions) {
                    const option = document.createElement('option');
                    option.value = province;
                    option.textContent = province;
                    provinceSelect.appendChild(option);
                }

                // 如果有预填数据，设置选中状态并加载下级选项
                if (prefillProvince) {
                    provinceSelect.value = prefillProvince;
                    // 触发省份变化事件，加载城市
                    provinceSelect.dispatchEvent(new Event('change'));

                    // 等待城市加载完成后设置选中
                    setTimeout(() => {
                        if (prefillCity) {
                            citySelect.value = prefillCity;
                            // 触发城市变化事件，加载区县
                            citySelect.dispatchEvent(new Event('change'));

                            // 等待区县加载完成后设置选中
                            setTimeout(() => {
                                if (prefillDistrict) {
                                    districtSelect.value = prefillDistrict;
                                }
                            }, 100);
                        }
                    }, 100);
                }
            })
            .catch(err => {
                showMessage('加载地区数据失败，请刷新页面重试', 'error');
                console.error(err);
            });

        // 省份变化
        provinceSelect.onchange = function() {
            citySelect.innerHTML = '<option value="">请选择</option>';
            districtSelect.innerHTML = '<option value="">请选择</option>';
            citySelect.disabled = !this.value;
            districtSelect.disabled = true;

            if (this.value && regions[this.value]) {
                for (const city in regions[this.value]) {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    citySelect.appendChild(option);
                }
            }
        };

        // 城市变化
        citySelect.onchange = function() {
            districtSelect.innerHTML = '<option value="">请选择</option>';
            districtSelect.disabled = !this.value;

            const city = this.value;
            const province = provinceSelect.value;

            if (province && city && regions[province] && regions[province][city]) {
                const districts = regions[province][city];
                districts.forEach(district => {
                    const option = document.createElement('option');
                    option.value = district;
                    option.textContent = district;
                    districtSelect.appendChild(option);
                });
            }
        };

        // 表单提交验证
        form.onsubmit = function(e) {
            const phone = document.getElementById('phone').value;
            const phonePattern = /^1[3-9]\d{9}$/;

            if (!phonePattern.test(phone)) {
                e.preventDefault();
                showMessage('请输入有效的11位手机号码', 'error');
                return false;
            }

            if (!provinceSelect.value || !citySelect.value || !districtSelect.value) {
                e.preventDefault();
                showMessage('请完整选择省市区', 'error');
                return false;
            }

            // 隐藏错误信息，显示提交中状态
            errorMessage.style.display = 'none';
            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.textContent = '提交中...';
            submitBtn.disabled = true;

            // 恢复按钮状态（如果提交失败）
            setTimeout(() => {
                submitBtn.textContent = '提交地址信息';
                submitBtn.disabled = false;
            }, 3000);
        };

        // 手机号实时格式化
        document.getElementById('phone').addEventListener('input', function(e) {
            this.value = this.value.replace(/\D/g, '').slice(0, 11);
        });
    </script>
</body>
</html>
