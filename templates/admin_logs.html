<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>系统日志 - 管理后台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        body {
            align-items: flex-start;
            padding: 20px;
        }

        .page-container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: var(--radius-xl);
            padding: 24px 30px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--bg-start) 0%, var(--bg-end) 100%);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title h2 {
            font-size: 24px;
            color: var(--text-primary);
            font-weight: 700;
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            background: #f3f4f6;
        }

        .conn-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #9ca3af;
        }

        .conn-dot.connected { background: #22c55e; }
        .conn-dot.connecting { background: #f59e0b; animation: pulse 1s infinite; }
        .conn-dot.disconnected { background: #ef4444; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .log-card {
            background: white;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both;
        }

        .log-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-light);
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }

        .log-filter {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-btn {
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .filter-btn.error-count {
            background: #fef2f2;
            color: #dc2626;
            border-color: #fecaca;
        }

        .filter-btn.error-count.active {
            background: #dc2626;
            border-color: #dc2626;
            color: white;
        }

        .log-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .auto-scroll {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .auto-scroll input[type="checkbox"] {
            accent-color: var(--primary);
        }

        .log-container {
            height: 70vh;
            overflow-y: auto;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-entry {
            padding: 10px 20px;
            border-bottom: 1px solid #f3f4f6;
            transition: background 0.15s;
        }

        .log-entry:hover {
            background: #f9fafb;
        }

        .log-entry.level-ERROR {
            background: #fef2f2;
            border-left: 3px solid #dc2626;
        }

        .log-entry.level-WARN {
            background: #fffbeb;
            border-left: 3px solid #f59e0b;
        }

        .log-entry.new-entry {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-meta {
            display: flex;
            gap: 12px;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .log-timestamp {
            color: #6b7280;
            font-size: 12px;
            white-space: nowrap;
        }

        .log-level {
            font-size: 11px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .log-level.ERROR { background: #dc2626; color: white; }
        .log-level.WARN { background: #f59e0b; color: white; }
        .log-level.INFO { background: #3b82f6; color: white; }
        .log-level.DEBUG { background: #6b7280; color: white; }

        .log-source {
            color: var(--primary);
            font-size: 12px;
            font-weight: 500;
        }

        .log-message {
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .stats-bar {
            display: flex;
            gap: 16px;
            padding: 12px 20px;
            background: #f9fafb;
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .stat-dot.error { background: #dc2626; }
        .stat-dot.warn { background: #f59e0b; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .header { padding: 18px 16px; }
            .log-entry { padding: 8px 12px; }
            .log-meta { flex-wrap: wrap; gap: 6px; }
        }
    </style>
</head>
<body>

<div class="page-container">
    <div class="header">
        <div class="header-top">
            <div class="title">
                <i class="fas fa-scroll" style="font-size: 28px; color: var(--primary);"></i>
                <h2>系统日志</h2>
            </div>
            <div class="actions">
                <div class="connection-status">
                    <span class="conn-dot" id="connDot"></span>
                    <span id="connText">连接中...</span>
                </div>
                <a href="/admin/panel" class="btn btn-light btn-sm">
                    <i class="fas fa-arrow-left"></i> 返回面板
                </a>
                <button class="btn btn-primary btn-sm" id="clearBtn" onclick="clearLogs()">
                    <i class="fas fa-trash-alt"></i> 清空
                </button>
            </div>
        </div>
    </div>

    <div class="log-card">
        <div class="log-toolbar">
            <div class="log-filter">
                <button class="filter-btn active" data-level="all" onclick="filterLogs('all', this)">全部</button>
                <button class="filter-btn error-count" data-level="ERROR" onclick="filterLogs('ERROR', this)">
                    错误 <span id="errorCount">0</span>
                </button>
                <button class="filter-btn" data-level="WARN" onclick="filterLogs('WARN', this)">
                    警告 <span id="warnCount">0</span>
                </button>
                <button class="filter-btn" data-level="INFO" onclick="filterLogs('INFO', this)">信息</button>
            </div>
            <div class="log-controls">
                <div class="auto-scroll">
                    <input type="checkbox" id="autoScroll" checked>
                    <label for="autoScroll">自动滚动</label>
                </div>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-dot error"></span>
                <span>错误: <strong id="statError">0</strong></span>
            </div>
            <div class="stat-item">
                <span class="stat-dot warn"></span>
                <span>警告: <strong id="statWarn">0</strong></span>
            </div>
            <div class="stat-item">
                共 <strong id="statTotal">0</strong> 条
            </div>
        </div>

        <div class="log-container" id="logContainer">
            <div class="empty-state" id="emptyState">
                <i class="fas fa-stream"></i>
                <p>等待日志输出...</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
    const logContainer = document.getElementById('logContainer');
    const emptyState = document.getElementById('emptyState');
    const connDot = document.getElementById('connDot');
    const connText = document.getElementById('connText');

    let currentFilter = 'all';
    let errorCount = 0;
    let warnCount = 0;
    let totalCount = 0;

    const socket = io({
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionAttempts: Infinity,
        reconnectionDelay: 1000,
    });

    socket.on('connect', () => {
        connDot.className = 'conn-dot connected';
        connText.textContent = '已连接';
        socket.emit('join_logs');
    });

    socket.on('disconnect', () => {
        connDot.className = 'conn-dot disconnected';
        connText.textContent = '已断开';
    });

    socket.on('connect_error', () => {
        connDot.className = 'conn-dot connecting';
        connText.textContent = '重连中...';
    });

    socket.on('logs_connected', (data) => {
        console.log('已连接到日志流');
    });

    socket.on('log_entry', (entry) => {
        if (emptyState) {
            emptyState.remove();
        }

        const div = document.createElement('div');
        div.className = `log-entry level-${entry.level} new-entry`;
        div.dataset.level = entry.level;

        if (currentFilter !== 'all' && entry.level !== currentFilter) {
            div.style.display = 'none';
        }

        let metaHtml = '';
        if (entry.timestamp) {
            metaHtml += `<span class="log-timestamp">${escapeHtml(entry.timestamp)}</span>`;
        }
        metaHtml += `<span class="log-level ${entry.level}">${entry.level}</span>`;
        if (entry.source) {
            metaHtml += `<span class="log-source">${escapeHtml(entry.source)}</span>`;
        }

        div.innerHTML = `
            <div class="log-meta">${metaHtml}</div>
            <div class="log-message">${escapeHtml(entry.message)}</div>
        `;

        logContainer.appendChild(div);

        totalCount++;
        if (entry.level === 'ERROR') errorCount++;
        if (entry.level === 'WARN') warnCount++;

        updateStats();

        if (document.getElementById('autoScroll').checked) {
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        setTimeout(() => div.classList.remove('new-entry'), 300);
    });

    function filterLogs(level, btn) {
        currentFilter = level;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        document.querySelectorAll('.log-entry').forEach(entry => {
            if (level === 'all' || entry.dataset.level === level) {
                entry.style.display = '';
            } else {
                entry.style.display = 'none';
            }
        });
    }

    function clearLogs() {
        logContainer.innerHTML = `
            <div class="empty-state" id="emptyState">
                <i class="fas fa-stream"></i>
                <p>等待日志输出...</p>
            </div>
        `;
        errorCount = 0;
        warnCount = 0;
        totalCount = 0;
        updateStats();
    }

    function updateStats() {
        document.getElementById('errorCount').textContent = errorCount;
        document.getElementById('warnCount').textContent = warnCount;
        document.getElementById('statError').textContent = errorCount;
        document.getElementById('statWarn').textContent = warnCount;
        document.getElementById('statTotal').textContent = totalCount;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Load initial entries from server-rendered HTML
    {% for entry in entries %}
    (function() {
        if (emptyState) emptyState.remove();
        const div = document.createElement('div');
        div.className = 'log-entry level-{{ entry.level }}';
        div.dataset.level = '{{ entry.level }}';
        div.innerHTML = `
            <div class="log-meta">
                <span class="log-timestamp">{{ entry.timestamp }}</span>
                <span class="log-level {{ entry.level }}">{{ entry.level }}</span>
                {% if entry.source %}<span class="log-source">{{ entry.source }}</span>{% endif %}
            </div>
            <div class="log-message">{{ entry.message }}</div>
        `;
        logContainer.appendChild(div);
        totalCount++;
        {% if entry.level == 'ERROR' %}errorCount++;{% endif %}
        {% if entry.level == 'WARN' %}warnCount++;{% endif %}
    })();
    {% endfor %}

    updateStats();
    logContainer.scrollTop = logContainer.scrollHeight;
</script>

</body>
</html>
