<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地址确认</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .container {
            padding: 40px 30px;
            text-align: center;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: pulseScale 2s ease-in-out infinite;
        }

        h1 {
            font-size: 22px;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .message {
            font-size: 15px;
            color: var(--text-secondary);
            margin: 15px 0 25px 0;
            line-height: 1.6;
        }

        .nickname {
            color: var(--primary);
            font-weight: 600;
        }

        .btn-admin {
            margin-top: 10px;
            background: var(--primary);
            color: white;
            border: none;
        }

        .btn-admin:hover {
            box-shadow: var(--shadow-primary-hover);
        }
    </style>
</head>
<body>
    <div class="container animate-slideUp">
        <div class="icon">📝</div>

        <h1>您已填写过地址</h1>
        <p class="message">
            舰长 <span class="nickname">{{ nickname }}</span>，您之前已经提交过收货信息
        </p>

        <div class="highlight-box mb-20">
            提示：您可以选择更新地址或前往小蝰直播间
        </div>

        <div class="actions">
            <a href="/?force_form=1" class="btn btn-pink">
                <i class="fas fa-edit"></i> 更新地址
            </a>
            <a href="/view" class="btn btn-gradient">
                <i class="fas fa-eye"></i> 查看已提交信息
            </a>
        </div>

        <div class="info-box mt-20">
            <strong>为什么要更新？</strong>
            • 搬家或更换收货地址<br>
            • 修改收件人信息<br>
            • 核对之前的填写内容
        </div>

        <div class="mt-20">
            <a href="/logout" class="btn btn-ghost btn-block btn-sm">
                <i class="fas fa-sign-out-alt"></i> 退出登录
            </a>
            {% if current_user.uid|string in config.ADMIN_UIDS %}
                <a href="/admin/panel" class="btn btn-primary btn-block btn-sm mt-10">
                    <i class="fas fa-user-shield"></i> 管理员面板
                </a>
            {% endif %}
        </div>
    </div>
</body>
</html>
