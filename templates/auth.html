<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>弹幕鉴权</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "MiSans", -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, "Helvetica Neue",
                         Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            text-align: center;
        }

        .header h2 {
            font-size: 26px;
            color: #5a67d8;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 15px;
        }

        .code-container {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e53 100%);
            border-radius: 15px;
            padding: 25px;
            margin: 25px 0 15px;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
        }

        .code-label {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .code-value {
            color: white;
            font-size: 34px;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.15);
            padding: 14px;
            border-radius: 10px;
            letter-spacing: 8px;
            user-select: all;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .code-value:active {
            background: rgba(0, 0, 0, 0.25);
            transform: scale(0.98);
        }

        .copy-btn {
            margin-top: 14px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .copy-btn.copied {
            background: #48bb78;
            border-color: #48bb78;
        }

        /* 直播间按钮（参考“你还不是舰长”页面） */
        .live-btn {
            margin-top: 16px;
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: #333;
            box-shadow: 0 4px 12px rgba(250, 112, 154, 0.35);
            transition: all 0.3s ease;
        }

        .live-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(250, 112, 154, 0.45);
        }

        .status-container {
            background: #f8f9ff;
            border-radius: 15px;
            padding: 18px;
            margin-top: 20px;
            border: 1px solid #e2e8f0;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-container i {
            margin-right: 6px;
        }

        .status-pending {
            color: #666;
        }

        .status-success {
            color: #48bb78;
            font-weight: 600;
        }

        .status-expired {
            color: #e53e3e;
        }

        .status-connecting {
            color: #667eea;
        }

        .footer {
            margin-top: 20px;
            color: #718096;
            font-size: 13px;
            border-top: 1px solid #e2e8f0;
            padding-top: 14px;
        }

        .connection-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        .conn-connecting {
            background: #ffa500;
            animation: pulse 1.5s infinite;
        }

        .conn-connected {
            background: #48bb78;
        }

        .conn-disconnected {
            background: #e53e3e;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .code-value {
                font-size: 28px;
                letter-spacing: 6px;
                padding: 12px;
            }

            .code-label {
                font-size: 14px;
            }

            .copy-btn {
                width: 100%;
                justify-content: center;
                padding: 14px 20px;
                font-size: 15px;
            }

            .live-btn {
                font-size: 14px;
                padding: 12px 16px;
            }
        }

        /* 超小屏幕适配 */
        @media (max-width: 360px) {
            .code-value {
                font-size: 24px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2><i class="fas fa-shield-alt"></i> 弹幕鉴权</h2>
        <p>请在直播间发送以下弹幕完成身份验证</p>
    </div>

    <div class="code-container">
        <div class="code-label">鉴权码（点击可复制）</div>
        <div class="code-value" id="authCode" title="点击复制">{{ code }}</div>

        <button class="copy-btn" id="copyBtn">
            <i class="fas fa-copy"></i> 一键复制鉴权码
        </button>
    </div>

    <!-- 新增：前往直播间 -->
    <a
        href="{{ config.ANCHOR_LIVE_URL }}"
        target="_blank"
        class="live-btn">
        🚢 前往 {{ config.ANCHOR_NICKNAME }} 的直播间
    </a>

    <!-- 鉴权登录说明（仅在登录模式下显示） -->
    {% if login_mode %}
    <div style="margin-top: 15px; padding: 12px; background: #e6f7ff; border-radius: 10px; border: 1px solid #91d5ff;">
        <p style="color: #0050b3; font-size: 14px; margin: 0;">
            <i class="fas fa-info-circle"></i> 鉴权成功后将自动登录并跳转到首页
        </p>
    </div>
    <!-- 隐藏的鉴权令牌（用于自动登录验证） -->
    {% endif %}

    <div class="status-container">
        <div id="status">
            <span class="connection-indicator conn-connecting"></span>
            <span class="status-pending">连接中…</span>
        </div>
    </div>

    <div class="footer">
        <i class="fas fa-lock"></i> 安全验证中，请勿关闭页面
    </div>
</div>

<!-- Socket.IO client library -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
    const uid = "{{ uid }}";
    const copyBtn = document.getElementById("copyBtn");
    const authCode = document.getElementById("authCode").innerText;
    const statusDiv = document.getElementById("status");

    // 复制鉴权码（带前缀）- 支持移动端
    async function copyAuthCode() {
        const text = `鉴权码：${authCode}`;

        // 尝试使用 Clipboard API
        try {
            await navigator.clipboard.writeText(text);
            showCopySuccess();
            return true;
        } catch (err) {
            console.log("Clipboard API failed, trying fallback method:", err);
        }

        // 备用方案：使用临时 textarea
        try {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();

            const successful = document.execCommand('copy');
            document.body.removeChild(textarea);

            if (successful) {
                showCopySuccess();
                return true;
            } else {
                showCopyFallback(text);
                return false;
            }
        } catch (err) {
            console.log("Fallback method failed:", err);
            showCopyFallback(text);
            return false;
        }
    }

    // 按钮点击事件
    copyBtn.addEventListener("click", copyAuthCode);

    // 点击鉴权码区域也可以复制（方便手机端操作）
    document.getElementById("authCode").addEventListener("click", async () => {
        const success = await copyAuthCode();
        if (success) {
            // 点击成功时的视觉反馈
            const codeEl = document.getElementById("authCode");
            codeEl.style.transform = "scale(0.95)";
            setTimeout(() => {
                codeEl.style.transform = "scale(1)";
            }, 100);
        }
    });

    function showCopySuccess() {
        copyBtn.classList.add("copied");
        copyBtn.innerHTML = '<i class="fas fa-check"></i> 已复制';
        setTimeout(() => {
            copyBtn.classList.remove("copied");
            copyBtn.innerHTML = '<i class="fas fa-copy"></i> 一键复制鉴权码';
        }, 2000);
    }

    function showCopyFallback(text) {
        // 在移动端显示可选择的文本框
        const fallbackDiv = document.createElement('div');
        fallbackDiv.style.cssText = `
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            z-index: 10000;
            max-width: 90%;
            text-align: center;
        `;
        fallbackDiv.innerHTML = `
            <div style="font-size: 16px; font-weight: 600; margin-bottom: 10px; color: #333;">复制鉴权码</div>
            <div style="background: #f8f9ff; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 18px; font-weight: 700; color: #667eea; margin-bottom: 15px; user-select: all; cursor: text; word-break: break-all;">鉴权码：${authCode}</div>
            <div style="font-size: 13px; color: #666; margin-bottom: 15px;">长按上方文本，选择"复制"</div>
            <button onclick="this.parentElement.remove()" style="padding: 10px 24px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">关闭</button>
        `;
        document.body.appendChild(fallbackDiv);

        // 点击外部关闭
        fallbackDiv.addEventListener('click', (e) => {
            if (e.target === fallbackDiv) {
                fallbackDiv.remove();
            }
        });
    }

    // WebSocket connection for instant auth feedback
    const socket = io({
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionAttempts: 5,
        reconnectionDelay: 1000,
        reconnectionDelayMax: 5000
    });

    // Connection status updates
    socket.on('connect', () => {
        console.log('WebSocket connected');
        statusDiv.innerHTML = `
            <span class="connection-indicator conn-connected"></span>
            <span class="status-pending">已连接，等待弹幕鉴权…</span>
        `;
        // Join the auth room for this UID
        const urlParams = new URLSearchParams(window.location.search);
        const loginMode = urlParams.get('login_mode') === 'true';
        const resetMode = urlParams.get('reset_mode') === 'true';
        socket.emit('join_auth', {
            uid: uid,
            login_mode: loginMode,
            reset_mode: resetMode
        });
    });

    socket.on('connect_error', (error) => {
        console.log('WebSocket connection error:', error);
        statusDiv.innerHTML = `
            <span class="connection-indicator conn-disconnected"></span>
            <span class="status-expired">连接失败，请刷新页面重试</span>
        `;
    });

    socket.on('disconnect', (reason) => {
        console.log('WebSocket disconnected:', reason);
        statusDiv.innerHTML = `
            <span class="connection-indicator conn-disconnected"></span>
            <span class="status-expired">连接断开，重连中…</span>
        `;
    });

    // Receive auth success event from server
    socket.on('auth_success', (data) => {
        console.log('Auth success via WebSocket:', data);
        console.log('Redirect URL:', data.redirect);
        console.log('UID:', data.uid);
        console.log('Nickname:', data.nickname);
        statusDiv.innerHTML = `
            <span class="connection-indicator conn-connected"></span>
            <span class="status-success">✅ 鉴权成功，正在跳转…</span>
        `;
        setTimeout(() => {
            // 使用 auth_status 返回的跳转地址
            const redirectUrl = data.redirect || `/?uid=${uid}`;
            console.log('跳转到:', redirectUrl);
            location.href = redirectUrl;
        }, 800);
    });

    socket.on('joined', (data) => {
        console.log('Joined room:', data);
    });
</script>

</body>
</html>
