<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>重置密码 - 舰长地址收集系统</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .container {
            max-width: 420px;
        }

        .content {
            padding: 32px;
        }

        .instruction {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 25px;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container animate-slideUp">
    <div class="card-header">
        <i class="fas fa-key" style="font-size: 42px; margin-bottom: 12px; opacity: 0.9; display: block;"></i>
        <h1>重置密码</h1>
        <div class="nickname">{{ nickname }}</div>
    </div>

    <div class="content stagger">
        <p class="instruction">
            UID: <strong>{{ uid }}</strong><br>
            验证成功！请设置新密码
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        <i class="fas fa-{{ 'check-circle' if category == 'success' else 'exclamation-circle' }}"></i>
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/reset-password?uid={{ uid }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="new_password" placeholder="请输入新密码（至少8位）" required minlength="8" autocomplete="off">
                </div>
            </div>
            <div class="form-group">
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="confirm_password" placeholder="请再次输入新密码" required minlength="8" autocomplete="off">
                </div>
            </div>
            <button type="submit" class="btn btn-gradient btn-block">
                <i class="fas fa-check"></i> 确认重置
            </button>
        </form>

        <div class="page-footer mt-25">
            <a href="/login?uid={{ uid }}"><i class="fas fa-arrow-left"></i> 返回登录</a>
        </div>
    </div>
    <div class="page-footer">
        <a href="https://github.com/HosisoraLing/bilibili-sailing-helper" target="_blank">
            <i class="fab fa-github"></i> bilibili-sailing-helper
        </a>
        <span> | AGPLv3 Licensed</span>
    </div>


    
</div>

</body>
</html>
