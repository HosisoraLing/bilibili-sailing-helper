<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>账号注册</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .container {
            max-width: 480px;
        }

        .content {
            padding: 32px;
        }

        .content h1 {
            text-align: center;
            margin-bottom: 22px;
            font-size: 22px;
            color: var(--text-primary);
        }

        .tip {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="container animate-slideUp">
    <div class="card-header">
        <i class="fas fa-user-plus" style="font-size: 42px; margin-bottom: 12px; opacity: 0.9; display: block;"></i>
        <h1>设置登录密码</h1>
    </div>

    <div class="content stagger">
        <div class="info-card mb-20">
            <div class="info-row">
                <div class="info-label">UID</div>
                <div class="info-value">{{ uid }}</div>
            </div>
            <div class="info-row">
                <div class="info-label">昵称</div>
                <div class="info-value">{{ nickname }}</div>
            </div>
        </div>

        {% with messages = get_flashed_messages(category_filter=['error']) %}
        {% if messages %}
            <div class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i>
                {{ messages[0] }}
            </div>
        {% endif %}
        {% endwith %}

        <form method="post">
            <input type="hidden" name="uid" value="{{ uid }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label>密码（至少 8 位，包含大小写字母、数字、特殊字符）</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" required minlength="8" placeholder="请输入密码">
                </div>
            </div>

            <div class="form-group">
                <label>确认密码</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="confirm_password" required minlength="8" placeholder="请再次输入密码">
                </div>
            </div>

            <button class="btn btn-gradient btn-block" type="submit">
                <i class="fas fa-check"></i> 完成注册并填写地址
            </button>
        </form>

        <div class="tip">
            <i class="fas fa-info-circle"></i> 密码设置完成后将自动登录
        </div>
    </div>
</div>

<div class="page-footer">
    <a href="https://github.com/HosisoraLing/bilibili-sailing-helper" target="_blank">
        <i class="fab fa-github"></i> bilibili-sailing-helper
    </a>
    <span> | AGPLv3 Licensed</span>
</div>

</body>
</html>
