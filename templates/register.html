<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>账号注册</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <style>
        /* 省略部分变量，与你原版一致 */
        :root {
            --bg-start: #667eea;
            --bg-end: #764ba2;
            --primary: #667eea;
            --btn-start: #fa709a;
            --btn-end: #fee140;
            --success: #06d6a0;
            --error: #e74c3c;
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --info-bg: #f8f9fb;
            --border-radius: 16px;
        }

        body {
            font-family: "MiSans", 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            background: linear-gradient(135deg,var(--bg-start),var(--bg-end));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #fff;
            border-radius: var(--border-radius);
            max-width: 500px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .info-card {
            background: var(--info-bg);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .info-item {
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg,var(--btn-start),var(--btn-end));
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .error {
            color: var(--error);
            text-align: center;
            margin-bottom: 12px;
        }

        .tip {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>设置登录密码</h1>

    <div class="info-card">
        <div class="info-item">UID：{{ uid }}</div>
        <div class="info-item">昵称：{{ nickname }}</div>
    </div>

    {% with messages = get_flashed_messages(category_filter=['error']) %}
    {% if messages %}
        <div class="error">{{ messages[0] }}</div>
    {% endif %}
    {% endwith %}

    <form method="post">
        <input type="hidden" name="uid" value="{{ uid }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label>密码（至少 8 位，包含大小写字母、数字、特殊字符）</label>
            <input type="password" name="password" required minlength="8">
        </div>

        <div class="form-group">
            <label>确认密码</label>
            <input type="password" name="confirm_password" required minlength="8">
        </div>

        <button class="btn" type="submit">
            完成注册并填写地址
        </button>
    </form>

    <div class="tip">
        密码设置完成后将自动登录
    </div>
</div>

</body>
</html>
