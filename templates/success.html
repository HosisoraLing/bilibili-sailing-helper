<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if submitted %}地址已更新{% else %}提交成功{% endif %}</title>
    <link rel="stylesheet" href="/static/fonts/fonts.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "MiSans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .success-icon {
            font-size: 70px;
            margin-bottom: 20px;
            animation: bounce 0.6s ease-out;
            display: inline-block;
        }

        @keyframes bounce {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(5deg); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .message {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .highlight {
            color: #e74c3c;
            font-weight: 600;
            display: inline-block;
            animation: heartBeat 1.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            10%, 30% { transform: scale(1.1); }
            20%, 40% { transform: scale(1); }
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            display: inline-block;
        }

        .btn-home {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .btn-check {
            background: #f0f4f8;
            color: #4a5568;
            border: 2px solid #e2e8f0;
        }

        .btn-check:hover {
            background: #e2e8f0;
            border-color: #cbd5e0;
        }

        .success-checkmark {
            font-size: 14px;
            color: #2ecc71;
            margin-top: 15px;
            opacity: 0;
            animation: fadeIn 0.5s ease-out 0.3s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f39c12;
            animation: confetti-fall 3s linear infinite;
            opacity: 0;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(500px) rotate(720deg);
                opacity: 0;
            }
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
                border-radius: 16px;
            }

            .success-icon {
                font-size: 60px;
            }

            h1 {
                font-size: 20px;
            }

            .message {
                font-size: 15px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        /* 闪烁提示 */
        .flash-tip {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            animation: flash 2s ease-in-out infinite;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>

        <h1>
            {% if submitted %}
                地址已更新
            {% else %}
                提交成功
            {% endif %}
        </h1>

        <p class="message">
            {% if submitted %}
                您的收货信息已成功更新
            {% else %}
                感谢支持 <span class="highlight">小蝰</span> ❤️
            {% endif %}
        </p>

        <div class="success-checkmark">
            ✓ 信息已妥善保存
        </div>

        <div class="actions">
            <a href="/" class="btn btn-home">返回首页</a>
            {% if not submitted %}
                <a href="/?uid={{ uid }}" class="btn btn-check">检查已提交信息</a>
            {% endif %}
        </div>

        {% if not submitted %}
        <div class="flash-tip">
            💡 提示：您可以通过UID重新进入页面查看或修改地址
        </div>
        {% endif %}
    </div>

    <script>
        // 添加彩纸动画效果（可选）
        function createConfetti() {
            const colors = ['#f39c12', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6'];
            const container = document.body;

            for (let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    container.appendChild(confetti);

                    // 清理
                    setTimeout(() => {
                        if (confetti.parentNode) {
                            confetti.parentNode.removeChild(confetti);
                        }
                    }, 4000);
                }, i * 100);
            }
        }

        // 页面加载完成后触发彩纸效果
        window.addEventListener('load', () => {
            setTimeout(createConfetti, 300);
        });

        // 3秒后自动隐藏提示
        const flashTip = document.querySelector('.flash-tip');
        if (flashTip) {
            setTimeout(() => {
                flashTip.style.opacity = '0';
                flashTip.style.transition = 'opacity 0.5s';
                setTimeout(() => flashTip.remove(), 500);
            }, 4000);
        }
    </script>
</body>
</html>
