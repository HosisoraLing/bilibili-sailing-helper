services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bilibili-sailing-helper
    restart: unless-stopped

    ports:
      - "7111:7111"    # HTTP
      - "7112:7112"    # HTTPS（如启用 SSL）

    volumes:
      # settings.json 含密钥，bind mount 而非打入镜像
      - ./settings.json:/app/settings.json:ro

      # SQLite 数据库持久化
      - ./data:/app/data

      # 日志持久化
      - ./logs:/app/logs

      # SSL 证书（可选，不配置 SSL 时此行无影响）
      # - ./ssl/:/app/ssl/:ro

    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - TZ=Asia/Shanghai

    # 日志配置（避免容器日志无限增长）
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

    # 资源限制（按需调整）
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
